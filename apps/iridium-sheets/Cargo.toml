[package]
name = "iridium-sheets"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "iridium-sheets"
description = "Sheets desktop app"

[lints]
workspace = true

[dependencies]
iridium-core = { workspace = true }
iridium-engine = { workspace = true }
iridium-sheets-shell = { workspace = true }
iridium-ui-egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11", "clipboard"] }
egui = { workspace = true }
log = { workspace = true }
image = { workspace = true }
chrono = { workspace = true }

[build-dependencies]
# Icon + VERSIONINFO for iridium-sheets.exe; build.rs only uses it when the target is Windows.
winresource = "0.1"

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "linux"))))'.dependencies]
winit = { version = "0.30", default-features = false, features = ["x11"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Retain X11 fallback; draw Wayland client-side controls without bundled title fonts.
winit = { version = "0.30", default-features = false, features = ["x11", "wayland-csd-adwaita-notitle"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Same craft-libs revision as the workspace's craft-update and craft-window (see the root
# Cargo.toml).
craft-update = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
# Blocks on the start-up DirectX 12 adapter probe (`graphics.rs`); already in the tree via eframe.
pollster = "1"

[target.'cfg(target_os = "macos")'.dependencies]
# Registers the Finder / Open With Apple-event handler before the event loop starts (the shell
# drains the inbox). Pinned exactly: review the diff before bumping.
fmv-macos-events = "=0.1.0"
