[package]
name = "iridium-xlsx"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Iridium Sheets file formats: XLSX (SpreadsheetML) and CSV import/export"

[lints]
workspace = true

[features]
# Builds password-encrypted workbooks in code for other crates' tests (a dev-dependency feature;
# never enabled in a shipped build).
test-support = []

[dependencies]
iridium-core = { workspace = true }
iridium-formula = { workspace = true }
iridium-math = { workspace = true }
iridium-model = { workspace = true }
thiserror = { workspace = true }
quick-xml = { workspace = true }
zip = { workspace = true }
aes = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
# Every registered function name, for the formula file-spelling test.
iridium-functions = { workspace = true }
